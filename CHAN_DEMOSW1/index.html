<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LIST</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
<script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
</head>
<body class="container mt-5">
	<h1>LIST {Adding and Deleting}</h1>
	<p>Enter a value to add or delete</p>

	<input type="text" id="user_input" class="form-control mb-3">

	<button type="button" class="btn-success" py-click="append_value">ADD</button>
	<button type="button" class="btn-danger" py-click="delete_value">DELETE</button>

	<h3 class="mt-4">Attendance</h3>
	<div id="output"></div>
	<p id="message"></p>

	<py-script src="main.py"></py-script>

</body>
</html>
